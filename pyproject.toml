[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facekey"
version = "0.0.1"
description = "Software face-authentication toolkit: enroll a face, verify against it later."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Adm145" }]

dependencies = [
    "insightface",
    "onnxruntime",
    "opencv-python-headless",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["facekey"]
